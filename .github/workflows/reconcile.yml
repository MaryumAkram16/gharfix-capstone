# Re-sends booking confirmation emails that never went out.
# Vercel Hobby cron runs only once a day, so GitHub Actions calls
# /api/reconcile every 15 minutes instead.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   RECONCILE_URL  full URL of the deployed endpoint, e.g. https://<your-app>.vercel.app/api/reconcile
#   CRON_SECRET    the same value as CRON_SECRET in the Vercel project's environment variables
#
# Scheduled workflows only run from the repository's default branch, and
# GitHub may delay or skip scheduled runs under load.

name: Reconcile booking confirmations

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Needs no access to the repository itself.
permissions: {}

# Never two runs at once: overlapping runs could both email the same customer.
concurrency:
  group: reconcile-confirmations
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/reconcile
        env:
          RECONCILE_URL: ${{ secrets.RECONCILE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RECONCILE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Set the RECONCILE_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 90 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${RECONCILE_URL}")
          echo "HTTP ${status}"
          cat response.json
          echo
          if [ "${status}" != "200" ]; then
            echo "::error::Reconcile answered HTTP ${status}"
            exit 1
          fi
